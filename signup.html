<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Course Registration Portal</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-circle">
                    <span>✨</span>
                </div>
                <h2>Create an Account</h2>
                <p>Join us to start managing your courses</p>
            </div>
            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <div class="input-container">
                        <span class="input-icon">👤</span>
                        <input type="text" id="signupName" required placeholder="Enter your full name">
                    </div>
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <div class="input-container">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="signupEmail" required placeholder="Enter your email">
                    </div>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <div class="input-container">
                        <span class="input-icon">🔑</span>
                        <input type="password" id="signupPassword" required placeholder="Create a password">
                    </div>
                </div>
                <div id="signupError" class="error-message"></div>
                <button type="submit" class="btn btn-primary btn-full">Sign Up</button>
            </form>
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Login</a></p>
                <p class="back-home"><a href="index.html">← Back to Home</a></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
